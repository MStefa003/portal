# cargo-deny policy, checked on every push (.github/workflows/ci.yml).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

# Known vulnerabilities and unmaintained or yanked crates (RustSec).
[advisories]
version = 2
yanked = "deny"
ignore = [
    # A compile-time macro crate with no runtime code, unmaintained but not
    # vulnerable; iroh's Linux network monitoring (netlink-packet-core) needs it.
    { id = "RUSTSEC-2024-0436", reason = "build-time only; comes from iroh" },
]

# Licenses Portal (MIT OR Apache-2.0) can ship with.
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside this workspace have no version.
allow-wildcard-paths = true

# Crates only from crates.io, never from arbitrary git repositories.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
