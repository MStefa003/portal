[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MStefa003/portal"
authors = ["Marios Stefanidis"]

[workspace.dependencies]
portal-core = { path = "crates/portal-core" }
portal-proto = { path = "crates/portal-proto" }
portal-net = { path = "crates/portal-net" }
portal-rendezvous = { path = "crates/portal-rendezvous" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
fastcdc = "5.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
ignore = "0.4.33"
indicatif = "0.18.6"
iroh = "1.4.0"
mainline = { version = "8.0.1", default-features = false, features = ["async"] }
mdns-sd = { version = "0.21.6", default-features = false, features = ["async"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
spake2 = "0.4.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.14.3"

# Test-only.
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

# Full debug info for ~300 dependencies across every test binary costs many
# GB in target/. Keep line numbers for our own backtraces, none for deps.
[profile.dev]
debug = "line-tables-only"
# Incremental caches are kept per build and never pruned; they grew past
# 1 GB here. Our crates are small, so full rebuilds of them are cheap.
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
