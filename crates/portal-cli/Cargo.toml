[package]
name = "portal-cli"
description = "Secure peer-to-peer file and folder transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["file-transfer", "p2p", "encryption", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "portal"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
console.workspace = true
indicatif.workspace = true
portal-core.workspace = true
portal-net.workspace = true
portal-proto.workspace = true
reqwest.workspace = true
rustls.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webpki-roots.workspace = true

# The build script runs on the build machine, so this is the host's cfg.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
mainline.workspace = true
portal-rendezvous.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# `cargo binstall --git https://github.com/MStefa003/portal portal-cli`
# downloads the release archive instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/portal-v{ version }-{ target }{ archive-suffix }"
bin-dir = "portal-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
