name: Release

# Push a tag like v0.2.0 to build every platform and publish a GitHub Release.
#
# Required: the PORTAL_SIGNING_KEY secret. Every archive is signed with it
# (minisign format) and `portal update` refuses unsigned ones, so without it
# nothing is published. See docs/RELEASING.md.
#
# Optional, each enabled by adding its secrets (see docs/RELEASING.md):
# - Windows code signing through SignPath: SIGNPATH_API_TOKEN secret and
#   SIGNPATH_ORGANIZATION_ID variable.
# - macOS signing and notarization: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD secrets.
# - winget: WINGET_TOKEN secret.
# Without them the release is built and published unsigned, as before.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build provenance attestations (`gh attestation verify`).
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # The oldest supported Ubuntu runner, so the binaries need only an old glibc.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    env:
      NAME: portal-${{ github.ref_name }}-${{ matrix.target }}
      BIN: target/${{ matrix.target }}/release
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads rust-toolchain.toml; the target is added to that toolchain.
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p portal-cli -p portal-rendezvous

      # --- Windows signing (optional) ---
      - name: Upload unsigned programs for signing
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.target }}
          path: |
            ${{ env.BIN }}/portal.exe
            ${{ env.BIN }}/portal-rendezvous.exe
      - name: Sign with SignPath
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: portal
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use the signed programs
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item signed/*.exe $env:BIN -Force

      # --- macOS signing and notarization (optional) ---
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          for program in portal portal-rendezvous; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$BIN/$program"
          done
          # Bare programs cannot be stapled; Gatekeeper checks the ticket online.
          ditto -c -k "$BIN/portal" "$BIN/portal-rendezvous" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory $env:NAME | Out-Null
          Copy-Item "$env:BIN/portal.exe", "$env:BIN/portal-rendezvous.exe", README.md, LICENSE-MIT, LICENSE-APACHE $env:NAME
          Compress-Archive $env:NAME "$env:NAME.zip"
          (Get-FileHash "$env:NAME.zip" -Algorithm SHA256).Hash.ToLower() + "  $env:NAME.zip" | Out-File -Encoding ascii "$env:NAME.zip.sha256"
          "ARCHIVE=$env:NAME.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir "$NAME"
          cp "$BIN/portal" "$BIN/portal-rendezvous" README.md LICENSE-MIT LICENSE-APACHE "$NAME"
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          echo "ARCHIVE=$NAME.tar.gz" >> "$GITHUB_ENV"

      # Lets anyone check that an archive was built here from this tag:
      #   gh attestation verify <archive> --repo MStefa003/portal
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.NAME }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      # Sign every archive; `portal update` checks these signatures.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install cryptography==44.0.0
      - name: Sign the archives
        env:
          PORTAL_SIGNING_KEY: ${{ secrets.PORTAL_SIGNING_KEY }}
        run: |
          python src/packaging/sign.py sign dist/*.zip dist/*.tar.gz
          # The key `portal update` has built in must accept them.
          key=$(grep -oP 'const RELEASE_KEY: &str = "\K[^"]+' src/crates/portal-cli/src/update.rs)
          python src/packaging/sign.py verify "$key" dist/*.zip dist/*.tar.gz

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/portal-*
          generate_release_notes: true

      # Scoop bucket and Homebrew tap live in this repository; update them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: repo
      - name: Update the Scoop, Homebrew and winget manifests
        working-directory: repo
        run: |
          python3 packaging/update_manifests.py "${{ github.ref_name }}" ../dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket Formula packaging/winget
          git commit -m "packaging: ${{ github.ref_name }} manifests" || exit 0
          git push

  winget:
    needs: publish
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.WINGET_TOKEN != ''
        with:
          ref: main
      - name: Submit to winget
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN packaging/winget
