name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The pinned toolchain in rust-toolchain.toml, which is also the minimum
  # supported Rust version (`rust-version` in Cargo.toml).
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          # Lets the desktop app's tests transfer to and from the `portal`
          # program, which the command line tool's tests build.
          PORTAL_CLI: ${{ github.workspace }}/target/debug/portal${{ runner.os == 'Windows' && '.exe' || '' }}

  # The newest stable Rust, which is what people building from source get.
  # Catches breakage from new compiler versions early.
  stable:
    name: latest stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +stable test --workspace --locked

  # Transfers between this build and published releases, both ways, so a
  # protocol change cannot silently break people on an older version:
  # the newest release, the first with text messages (protocol 2) and the
  # first release of all.
  compat:
    name: works with ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [latest, v0.3.0, v0.1.0]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Download ${{ matrix.release }}
        env:
          RELEASE: ${{ matrix.release }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$RELEASE" = latest ]; then
            # The redirect names the tag, without the rate-limited API.
            RELEASE=$(curl -fsSI "https://github.com/$REPO/releases/latest" | tr -d '\r' | sed -n 's|^location:.*/tag/||Ip')
          fi
          name="portal-$RELEASE-x86_64-unknown-linux-gnu"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/$REPO/releases/download/$RELEASE/$name.tar.gz"
          curl -fsSLO "https://github.com/$REPO/releases/download/$RELEASE/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz"
          echo "PORTAL_OLD_BIN=$RUNNER_TEMP/$name/portal" >> "$GITHUB_ENV"
      - run: cargo test -p portal-cli --test cli --locked compatible_with_an_older_release -- --nocapture

  # Known vulnerabilities (RustSec), licenses and where crates come from.
  # See deny.toml.
  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # Every fuzz target must still build; fuzz.yml runs them.
  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl program and would default to
      # building for musl, where the sanitizer cannot work.
      - run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu
