name: Desktop

# Builds Portal Desktop's downloads (a Windows installer and zip, a macOS disk
# image, a Linux archive) and tests them the way people get them: the install
# scripts install from them, the app has to start, and the uninstall scripts
# have to remove everything again.
#
# Runs when the desktop app or its packaging changes, by hand, and from
# release.yml (with `tag`), whose release then carries the files built here.
on:
  # Other branches are covered by their pull request; running for both would
  # ask for every Mac runner twice.
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/desktop/**"
      - "packaging/icon/**"
      - "install-desktop.*"
      - "uninstall-desktop.*"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/desktop/**"
      - "packaging/icon/**"
      - "install-desktop.*"
      - "uninstall-desktop.*"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The release tag, e.g. v0.6.0, used in the file names.
        type: string
        required: true

# A newer push replaces a test run still waiting; release runs always finish.
concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag }}

env:
  CARGO_TERM_COLOR: always
  # Test builds get a version that cannot be mistaken for a release.
  TAG: ${{ inputs.tag || 'v0.0.0-test' }}

jobs:
  package:
    name: package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Build provenance attestations, for releases.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
          # Intel Macs build both: GitHub often runs out of Apple Silicon
          # ones, and a queued job is cancelled after 15 minutes.
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15-intel }
          # The oldest supported Ubuntu runner, so the app needs only an old glibc.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    env:
      NAME: portal-desktop-${{ inputs.tag || 'v0.0.0-test' }}-${{ matrix.target }}
      BIN: target/${{ matrix.target }}/release
      # Signing is for releases only.
      APPLE_CERTIFICATE: ${{ inputs.tag && secrets.APPLE_CERTIFICATE || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: inputs.tag == ''
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p portal-desktop

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          New-Item -ItemType Directory $env:NAME | Out-Null
          Copy-Item "$env:BIN/portal-desktop.exe", LICENSE-MIT, LICENSE-APACHE $env:NAME
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis --no-progress -y }
            $env:Path += ";${env:ProgramFiles(x86)}\NSIS"
          }
          $source = (Resolve-Path $env:NAME).Path
          makensis /V2 "/DVERSION=$version" "/DNUMERIC_VERSION=$($version -replace '-.*$')" "/DSOURCE=$source" "/DOUTFILE=$PWD\$env:NAME-setup.exe" packaging/desktop/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive $env:NAME "$env:NAME.zip"
          foreach ($file in "$env:NAME-setup.exe", "$env:NAME.zip") {
            (Get-FileHash $file -Algorithm SHA256).Hash.ToLower() + "  $file" | Out-File -Encoding ascii "$file.sha256"
          }

      - name: App bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          app="$RUNNER_TEMP/dmg/Portal.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$BIN/portal-desktop" "$app/Contents/MacOS/"
          sed "s/@VERSION@/${TAG#v}/g" packaging/desktop/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          iconset="$RUNNER_TEMP/Portal.iconset"
          mkdir "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/icon/app.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) packaging/icon/app.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Portal.icns"
          # Signed for real below when the Apple secrets are set; otherwise
          # ad hoc, which Apple silicon needs to run it at all.
          codesign --force --sign - "$app"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Sign and notarize the app (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          # An app, unlike a bare program, can carry its ticket for offline checks.
          xcrun stapler staple "$APP"

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname Portal -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "$NAME.dmg"
          shasum -a 256 "$NAME.dmg" > "$NAME.dmg.sha256"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir "$NAME"
          cp "$BIN/portal-desktop" packaging/desktop/linux/portal-desktop.desktop LICENSE-MIT LICENSE-APACHE "$NAME"
          cp packaging/icon/app-256.png "$NAME/portal-desktop.png"
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: inputs.tag != ''
        with:
          # The downloads and their checksums, not the staging folder.
          subject-path: ${{ env.NAME }}*.*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ env.NAME }}*.*

  # Installs each download with the install script, from a local web server
  # standing in for GitHub, checks what it set up and that the app starts,
  # then removes it with the uninstall script.
  install:
    name: install ${{ matrix.target }}
    needs: package
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    env:
      PORTAL_VERSION: ${{ inputs.tag || 'v0.0.0-test' }}
      PORTAL_DOWNLOAD_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-${{ matrix.target }}
          path: dist

      - name: Install, check and remove (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Check($ok, $what) { if (-not $ok) { throw "FAILED: $what" } else { Write-Host "ok: $what" } }
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', "$PWD\dist" -PassThru -WindowStyle Hidden
          Start-Sleep 2
          try {
            # Windows PowerShell 5.1, which every Windows has, as people run it.
            powershell -NoProfile -ExecutionPolicy Bypass -File install-desktop.ps1
            Check ($LASTEXITCODE -eq 0) 'install-desktop.ps1 succeeded'
          } finally {
            Stop-Process -Id $server.Id -Force
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Portal Desktop'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PortalDesktop'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Portal.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Portal.lnk'
          Check (Test-Path "$dir\portal-desktop.exe") 'the app is installed'
          Check (Test-Path "$dir\uninstall.exe") 'the uninstaller is installed'
          Check (Test-Path $menu) 'Start menu shortcut'
          Check (Test-Path $desktop) 'desktop shortcut'
          Check ((Get-ItemProperty $key).DisplayName -eq 'Portal') 'listed in Settings > Apps'
          Check ((Get-ItemProperty $key).DisplayVersion -eq "$env:PORTAL_VERSION".TrimStart('v')) 'with its version'
          Start-Sleep 5
          Check ($null -ne (Get-Process portal-desktop -ErrorAction SilentlyContinue)) 'the app started and keeps running'
          # Next to the command line tool, without touching it.
          Check (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Portal\portal.exe'))) 'the command line tool was not installed'

          powershell -NoProfile -ExecutionPolicy Bypass -File uninstall-desktop.ps1
          Check ($LASTEXITCODE -eq 0) 'uninstall-desktop.ps1 succeeded'
          Start-Sleep 2
          Check (-not (Test-Path $dir)) 'the app folder is gone'
          Check (-not (Test-Path $menu)) 'the Start menu shortcut is gone'
          Check (-not (Test-Path $desktop)) 'the desktop shortcut is gone'
          Check (-not (Test-Path $key)) 'the Settings > Apps entry is gone'
          Check ($null -eq (Get-Process portal-desktop -ErrorAction SilentlyContinue)) 'the app was closed'

      - name: Install, check and remove (macOS)
        if: runner.os == 'macOS'
        run: |
          check() { if eval "$1"; then echo "ok: $2"; else echo "FAILED: $2"; exit 1; fi; }
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist & server=$!
          sleep 2
          sh install-desktop.sh
          kill $server
          app=/Applications/Portal.app
          check '[ -x "$app/Contents/MacOS/portal-desktop" ]' 'Portal.app is in Applications'
          check 'codesign --verify --deep --strict "$app"' 'its signature is valid'
          check '[ "$(defaults read "$app/Contents/Info" CFBundleShortVersionString)" = "${PORTAL_VERSION#v}" ]' 'with its version'
          check '[ -f "$app/Contents/Resources/Portal.icns" ]' 'and its icon'
          sleep 5
          check 'pgrep -x portal-desktop >/dev/null' 'the app started and keeps running'
          check '! command -v portal >/dev/null' 'the command line tool was not installed'
          pkill -x portal-desktop || true
          sh uninstall-desktop.sh
          check '[ ! -e "$app" ]' 'Portal.app is gone'

      - name: Install, check and remove (Linux)
        if: runner.os == 'Linux'
        run: |
          check() { if eval "$1"; then echo "ok: $2"; else echo "FAILED: $2"; exit 1; fi; }
          # A virtual screen to start the app on, and the X11 libraries that
          # desktops have and the app loads when it starts.
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb desktop-file-utils libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 >/dev/null
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist & server=$!
          sleep 2
          sh install-desktop.sh
          kill $server
          bin=$HOME/.local/bin/portal-desktop
          entry=$HOME/.local/share/applications/portal-desktop.desktop
          icon=$HOME/.local/share/icons/hicolor/256x256/apps/portal-desktop.png
          check '[ -x "$bin" ]' 'the app is installed'
          check '[ -f "$icon" ]' 'its icon'
          check 'desktop-file-validate "$entry"' 'a valid applications menu entry'
          check 'grep -qx "Exec=$bin" "$entry"' 'that starts the installed app'
          # Still running when `timeout` stops it (exit code 124): it started.
          set +e
          xvfb-run -a timeout 8 "$bin"
          code=$?
          set -e
          check '[ $code -eq 124 ]' "the app started and keeps running (exit code $code)"
          check '[ ! -e "$HOME/.local/bin/portal" ]' 'the command line tool was not installed'
          sh uninstall-desktop.sh
          check '[ ! -e "$bin" ] && [ ! -e "$entry" ] && [ ! -e "$icon" ]' 'everything is gone'
